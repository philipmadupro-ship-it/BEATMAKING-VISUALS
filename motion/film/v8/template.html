<!doctype html>
<html lang="en" data-look="{{LOOK}}" data-test="{{TEST}}" data-stage="{{STAGE}}" data-aspect="{{ASPECT}}" data-resolution="{{RES}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>U2C LAB beat preview</title>
    <style>
      @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url("assets/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 800; src: url("assets/fonts/jetbrains-mono-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 700; src: url("assets/fonts/Caveat-700-latin.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: #030303; }
      #stage { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}" data-fps="30">
      <canvas id="stage" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0" width="{{W}}" height="{{H}}"></canvas>
    </div>
    <script src="lib/gsap.min.js"></script>
    <script src="{{DATA}}"></script>
    <script src="assets/brand/links.js"></script>
    <script src="assets/brand/elephant-rig.js"></script>
    <script src="assets/elephant-loop.js"></script>
    <script src="{{TAGS}}"></script>
    <script src="v8/core.js"></script>
    <script src="v8/lab.js"></script>
    <script src="v8/meters8.js"></script>
    <script src="v8/meters.js"></script>
    <script src="v8/brand.js"></script>
    <script src="v8/film.js"></script>
  </body>
</html>
