[package]
name = "u2c_studio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "U2C Studio as a DAW plugin (VST3 + CLAP): host transport and audio tap to the web editor"

[workspace]
members = ["xtask", "updater"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", default-features = false, features = ["vst3"] }
include_dir = "0.7"
tiny_http = "0.12"
tungstenite = "0.24"
serde_json = "1"
wry = "0.50"
raw-window-handle = "0.6"
u2c_updater = { path = "updater" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = "thin"
strip = "symbols"
