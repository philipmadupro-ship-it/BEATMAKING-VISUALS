name: plugin
on:
  push:
    paths: ['plugin/**', 'web-app/src/**', 'web-app/index.html', 'web-app/assets/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['plugin/**', 'web-app/src/**', 'web-app/index.html', 'web-app/assets/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: plugin }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-randr0-dev libxcb-shape0-dev libgl-dev libx11-xcb-dev libxcursor-dev libasound2-dev libxdo-dev
      - name: Test
        run: cargo test --release
      - name: Bundle VST3 + CLAP
        run: cargo xtask bundle u2c_studio --release
      - name: AU via clap-wrapper (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true   # clap-wrapper API drifts; see plugin/README.md
        run: |
          git clone --depth 1 https://github.com/free-audio/clap-wrapper.git "$RUNNER_TEMP/clap-wrapper"
          cmake -S au -B build-au -DCLAP_WRAPPER_DIR="$RUNNER_TEMP/clap-wrapper" -DU2C_CLAP="$PWD/target/bundled/U2C Studio.clap" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-au --config Release
          mkdir -p target/bundled && cp -R build-au/*.component target/bundled/ || find build-au -name '*.component' -exec cp -R {} target/bundled/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: u2c-studio-${{ runner.os }}
          path: plugin/target/bundled/*
          if-no-files-found: error
